name: Post new blog entry to Bluesky

on:
  schedule:
    - cron: "0 * * * *"  # 毎時チェック（重いなら後で減らせます）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run autoposter
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          FEED_URL: https://tortoise-esprit.com/feed.xml
          STATE_FILE: .bsky_last_posted.json
        run: |
          python scripts/post_to_bluesky.py

      - name: Commit state file
        run: |
          if [ -f .bsky_last_posted.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .bsky_last_posted.json
            git commit -m "Update Bluesky autopost state" || echo "No changes"
            git push
          fi
